<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot IA — Agent avec mémoire</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- ── SIDEBAR ─────────────────────────────────────────── -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2 class="sidebar-title">Conversations</h2>
          <button class="btn-new-chat" id="btnNewChat">+ Nouvelle</button>
        </div>

        <div class="sessions-list" id="sessionsList">
          <!-- Rempli dynamiquement par scrip.js -->
          <p class="sessions-empty">Aucune conversation</p>
        </div>
      </aside>

      <!-- ── ZONE DE CHAT ────────────────────────────────────── -->
      <main class="chat-area">
        <div class="chat-header">
          <span class="chat-header-title" id="chatTitle">
            Nouvelle conversation
          </span>
        </div>

        <div class="messages-container" id="messagesContainer">
          <!-- Message de bienvenue par défaut -->
          <div class="welcome-message">
            <p>Bonjour 👋 Je suis votre agent IA avec mémoire.</p>
            <p>Je me souviens de nos conversations précédentes.</p>
          </div>
        </div>

        <div class="input-area">
          <textarea
            id="userInput"
            placeholder="Écrivez votre message..."
            rows="1"
          ></textarea>
          <button id="sendBtn">&#9658;</button>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
